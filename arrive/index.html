<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arrive™ — Interactive Prototype</title>
<meta name="description" content="Arrive — the verified-identity network for India's homes. Interactive product prototype.">
<meta property="og:title" content="Arrive™ — the verified-identity network for India's homes">
<meta property="og:description" content="One verified identity. Every door it opens. Interactive product prototype.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#141a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arrive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141a24'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='64' font-weight='700' text-anchor='middle' fill='%23e07a2b'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141a24; --ink-soft:#3d4657; --mute:#7a8494; --faint:#aab2bf;
    --line:#e7e9ee; --paper:#f6f7f9; --card:#ffffff;
    --emerald:#0f7a52; --emerald-soft:#e7f3ec; --emerald-line:#bfe0cd;
    --amber:#b5761f; --amber-soft:#fbf1de; --amber-line:#eccf9a;
    --red:#a8331f; --red-soft:#fbeae6;
    --saffron:#e07a2b; --blue:#2b5f8a; --blue-soft:#e6eff6;
    --shadow:0 1px 2px rgba(20,26,36,.04),0 8px 30px rgba(20,26,36,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#eef1f5 0,transparent 60%),radial-gradient(1000px 700px at 110% 20%,#f0ece6 0,transparent 55%),#e9ebf0;
    color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;min-height:100%;
  }
  .brandbar{display:flex;flex-direction:column;align-items:center;gap:13px;margin-bottom:18px}
  .wordmark .logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;letter-spacing:-.02em}
  .wordmark .logo b{color:var(--saffron)}
  .tag{font-size:12px;color:var(--ink-soft)}
  .thesislink{display:inline-flex;align-items:center;gap:6px;font-family:"Inter",sans-serif;font-size:12px;font-weight:600;color:var(--saffron);text-decoration:none;background:#fdf6ef;border:1px solid #e6c3a3;border-radius:999px;padding:6px 13px;margin-top:2px;transition:.18s}
  .thesislink:hover{background:#fbeede;border-color:#dca871}
  .thesislink span{transition:transform .18s}
  .thesislink:hover span{transform:translateX(3px)}
  .switch{display:inline-flex;background:#dfe3ea;border-radius:999px;padding:4px;gap:2px;box-shadow:inset 0 1px 3px rgba(20,26,36,.08);flex-wrap:wrap;justify-content:center}
  .switch button{border:0;background:transparent;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--ink-soft);padding:8px 15px;border-radius:999px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px}
  .switch button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
  .switch button.on{background:var(--ink);color:#fff;box-shadow:var(--shadow)}
  .switch button.on .dot{opacity:1;background:var(--saffron)}

  .stage{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .phone{width:392px;max-width:100%;background:var(--paper);border-radius:44px;box-shadow:0 2px 6px rgba(20,26,36,.10),0 30px 70px rgba(20,26,36,.22);border:1px solid rgba(255,255,255,.7);overflow:hidden;position:relative}
  .notch{height:34px;position:relative;background:var(--paper)}
  .notch::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:0;width:120px;height:22px;background:var(--ink);border-radius:0 0 16px 16px}
  .statusbar{position:absolute;top:9px;left:0;right:0;display:flex;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600}
  .screen{height:730px;overflow-y:auto;padding:6px 18px 84px;scrollbar-width:none;position:relative}
  .screen::-webkit-scrollbar{display:none}
  .laptop .screen{padding-bottom:24px}

  .apphead{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 14px}
  .apphead .lg{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px}
  .apphead .lg b{color:var(--saffron)}
  .apphead .lg .role{font-size:11px;color:var(--mute);font-weight:600}
  .apphead .sm{font-size:11.5px;color:var(--mute);margin-top:1px}
  .avatar{width:37px;height:37px;border-radius:11px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}

  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
  .eyebrow .live{width:7px;height:7px;border-radius:50%;background:var(--emerald);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,122,82,.5)}70%{box-shadow:0 0 0 7px rgba(15,122,82,0)}100%{box-shadow:0 0 0 0 rgba(15,122,82,0)}}

  .greet{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.01em;margin:2px 2px}
  .greet .q{color:var(--mute);font-weight:500}
  .sub{font-size:12.5px;color:var(--mute);margin:3px 2px 6px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
  .arrival{position:relative;overflow:hidden;transition:border-color .5s}
  .arrival .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber);transition:background .5s}
  .arrival.done .bar{background:var(--emerald)}
  .arrival.denied .bar{background:var(--red)}
  .arow{display:flex;align-items:center;gap:11px}
  .btile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none;font-family:"Bricolage Grotesque",sans-serif}
  .arow .meta{flex:1;min-width:0}
  .arow .meta .t{font-weight:700;font-size:14.5px;white-space:nowrap}
  .arow .meta .d{font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .state{font-size:10.5px;font-weight:700;padding:6px 9px;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:5px;flex:none}
  .state.pending{background:var(--amber-soft);color:var(--amber)}
  .state.verified{background:var(--emerald-soft);color:var(--emerald)}
  .state.denied{background:var(--red-soft);color:var(--red)}
  .state.done{background:#eef0f3;color:var(--mute)}
  .spin{width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
  .chk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .chk svg{color:var(--emerald);flex:none}
  .chk b{color:var(--ink);font-weight:600}
  .doorline{font-size:11.5px;color:var(--mute);margin-top:10px;display:flex;align-items:center;gap:6px}
  .doorline b{color:var(--emerald)}
  .quiet{font-size:11px;color:var(--mute);font-style:italic;margin:8px 4px 0;display:flex;gap:6px;align-items:flex-start}
  .upcoming .doorline{margin-top:11px;font-style:italic}
  .quiet svg{flex:none;margin-top:1px;color:var(--saffron)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:500;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
  .chip .k{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:none}
  .chip.add{color:var(--saffron);border-style:dashed;border-color:#e6c3a3;background:#fdf6ef;font-weight:600;cursor:pointer}

  .btn{border:0;font-family:inherit;font-weight:600;font-size:13px;padding:11px;border-radius:11px;cursor:pointer;transition:.15s}
  .btn.primary{background:var(--emerald);color:#fff}.btn.primary:hover{background:#0c6644}
  .btn.ghost{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line)}.btn.ghost:hover{background:#eef0f3}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.amber{background:var(--amber);color:#fff}
  .btn.block{width:100%}
  .rowbtns{display:flex;gap:8px;margin-top:12px}
  .rowbtns .btn{flex:1}

  .ask .q{font-size:14px;font-weight:600;line-height:1.35}
  .ask .q b{color:var(--saffron)}
  .answered-note{display:none;margin-top:10px;font-size:12px;color:var(--emerald);font-weight:600;align-items:center;gap:6px}
  .ask.answered .rowbtns{display:none}
  .ask.answered .answered-note{display:flex}

  .compose{position:absolute;left:14px;right:14px;bottom:70px;background:var(--ink);border-radius:15px;padding:10px 11px 10px 14px;display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px rgba(20,26,36,.3);z-index:5}
  .compose input{flex:1;border:0;background:transparent;color:#fff;font-family:inherit;font-size:13px;outline:none}
  .compose input::placeholder{color:#8b93a3}
  .compose .mic,.compose .send{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;cursor:pointer;border:0}
  .compose .mic{background:rgba(255,255,255,.1)}.compose .mic:hover{background:var(--saffron)}
  .compose .send{background:var(--saffron)}

  /* order simulator (resident) */

  /* GUARD */
  .g-hero{background:var(--ink);color:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}
  .g-hero .row{display:flex;justify-content:space-between;align-items:flex-start}
  .g-hero .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#8b93a3;font-weight:700}
  .g-hero .gate{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;margin-top:2px}
  .g-hero .q .n{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:800;line-height:1;text-align:right}
  .g-hero .q .c{font-size:10px;color:#8b93a3;text-align:right}
  .scanbtn{width:100%;margin-top:14px;border:0;font-family:inherit;font-weight:700;font-size:14.5px;color:var(--ink);background:#fff;border-radius:13px;padding:14px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:.15s}
  .scanbtn:hover{transform:translateY(-1px)}
  .scanbtn svg{color:var(--saffron)}
  .voice{background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:13px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start}
  .voice .ic{width:28px;height:28px;border-radius:8px;background:var(--amber);color:#fff;display:grid;place-items:center;flex:none}
  .voice .txt{font-size:12px;line-height:1.5;color:var(--ink-soft)}
  .voice .txt b{color:var(--ink)} .voice .hi{font-style:italic;color:var(--amber);font-weight:600}

  .qitem{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:.15s}
  .qitem:hover{border-color:var(--saffron)}
  .qitem .st{width:8px;height:8px;border-radius:50%;flex:none}
  .qitem .st.v{background:var(--emerald)} .qitem .st.p{background:var(--amber)}
  .qitem .info{flex:1;min-width:0}
  .qitem .info .t{font-size:13px;font-weight:600}
  .qitem .info .d{font-size:11px;color:var(--mute)}
  .qitem .go{color:var(--faint)}

  .verdict{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .verdict .head{padding:15px;color:#fff;display:flex;align-items:center;gap:11px}
  .verdict.ok .head{background:linear-gradient(135deg,#0f7a52,#0b6042)}
  .verdict.no .head{background:linear-gradient(135deg,#a8331f,#8a2617)}
  .verdict .badge{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
  .verdict .h{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px}
  .verdict .sh{font-size:12px;opacity:.9;margin-top:1px}
  .verdict .body{background:var(--card);padding:14px 15px}
  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .kv:last-of-type{border-bottom:0}.kv .k{color:var(--mute)}.kv .v{font-weight:600}.kv .v.ok{color:var(--emerald)}
  .reason{font-size:12px;color:var(--ink-soft);background:var(--paper);border-radius:10px;padding:10px 11px;margin-top:11px;display:flex;gap:8px;line-height:1.5}
  .reason.no{background:var(--red-soft);color:var(--red)}.reason svg{flex:none;margin-top:1px}
  .route-panel{margin-top:10px;background:var(--emerald-soft);border:1px solid var(--emerald-line);border-radius:12px;padding:12px}
  .ridermap{margin-top:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
  .ridermap .rmhead{font-size:11.5px;font-weight:700;color:var(--emerald);display:flex;align-items:center;gap:6px}
  .route-panel .rt{font-size:11px;font-weight:700;color:var(--emerald);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .step{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:12.5px}
  .step .num{width:18px;height:18px;border-radius:50%;background:var(--emerald);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}

  /* stat tiles / admin / partner */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
  .stat .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:23px;letter-spacing:-.01em}
  .stat .n.g{color:var(--emerald)} .stat .n.b{color:var(--blue)} .stat .n.a{color:var(--amber)}
  .stat .l{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.3}
  .stat .trend{font-size:10.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
  .stat .trend.up{color:var(--emerald)} .stat .trend.dn{color:var(--red)}

  .bars{display:flex;align-items:flex-end;gap:7px;height:88px;padding:6px 2px 0}
  .bars .b{flex:1;background:linear-gradient(180deg,#2b5f8a,#3d76a6);border-radius:5px 5px 0 0;position:relative;min-height:6px;transition:height .6s}
  .bars .b.hl{background:linear-gradient(180deg,#0f7a52,#12986a)}
  .bars .b span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:var(--ink-soft)}
  .barx{display:flex;gap:7px;margin-top:6px}.barx div{flex:1;text-align:center;font-size:9.5px;color:var(--mute)}

  .listrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:0}
  .listrow .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;color:#fff;font-size:12px}
  .listrow .m{flex:1;min-width:0}.listrow .m .t{font-size:13px;font-weight:600}.listrow .m .d{font-size:11px;color:var(--mute)}
  .pill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px}
  .pill.ok{background:var(--emerald-soft);color:var(--emerald)} .pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.info{background:var(--blue-soft);color:var(--blue)}

  .treasury{background:linear-gradient(135deg,#123,#1a3350);color:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .revhero{background:linear-gradient(135deg,#0f7a52,#0b5f40);color:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .revhero .rl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#a8e6c8;font-weight:700}
  .revhero .ra{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:32px;margin:3px 0 2px;letter-spacing:-.01em}
  .revhero .rs{font-size:11.5px;color:#cdeeda}
  .revhero .rsplit{display:flex;gap:7px;margin-top:13px}
  .revhero .rsplit div{flex:1;background:rgba(255,255,255,.1);border-radius:9px;padding:8px 6px;text-align:center}
  .revhero .rk{font-size:9.5px;color:#a8e6c8;margin-bottom:2px}
  .revhero .rv{font-weight:700;font-size:14px}
  .paycard{padding:13px 14px}
  .pcrow{display:flex;align-items:center;gap:11px}
  .pcico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
  .pcm{flex:1;min-width:0}
  .pcm .pct{font-size:13px;font-weight:700;color:var(--ink);line-height:1.2}
  .pcm .pcd{font-size:11px;color:var(--mute);margin-top:2px}
  .pcstat{text-align:right;flex:none}
  .pcstat .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;line-height:1}
  .pcstat .n.g{color:var(--emerald)} .pcstat .n.b{color:var(--blue)} .pcstat .n.a{color:var(--amber)}
  .pcstat .l{font-size:9px;color:var(--mute);margin-top:3px;line-height:1.2}
  .minibars{display:flex;align-items:flex-end;gap:5px;height:34px;margin:11px 0 0}
  .minibars .mb{flex:1;background:linear-gradient(180deg,#2b5f8a,#3d76a6);border-radius:3px 3px 0 0;min-height:4px}
  .pcfoot{font-size:11px;color:var(--ink2);margin-top:10px;display:flex;align-items:center;gap:5px}
  .pcfoot b{color:var(--emerald)} .pcfoot svg{color:var(--emerald);flex:none}
  .treasury .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fb3c9;font-weight:700}
  .treasury .amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;margin:4px 0 2px;letter-spacing:-.01em}
  .treasury .sub2{font-size:11.5px;color:#bcd0e2}
  .treasury .split{display:flex;gap:8px;margin-top:13px}
  .treasury .split div{flex:1;background:rgba(255,255,255,.08);border-radius:10px;padding:9px}
  .treasury .split .v{font-weight:700;font-size:15px} .treasury .split .k{font-size:10px;color:#9fb3c9;margin-top:2px}

  .navbar{position:absolute;left:0;right:0;bottom:0;height:62px;background:rgba(246,247,249,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:6px;z-index:6}
  .navbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--mute);font-weight:600;cursor:pointer;font-family:inherit}
  .navbar button.act{color:var(--ink)} .navbar button.act svg{color:var(--saffron)}

  .toast{position:absolute;left:50%;transform:translateX(-50%) translateY(20px);bottom:78px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:20;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:88%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{color:var(--saffron);flex:none}

  .caption{max-width:720px;margin:18px auto 0;text-align:center;font-size:12.5px;color:#5a6472;line-height:1.6}
  .caption b{color:var(--ink)}
  .hidden{display:none!important}
  /* neighbourhood map */
  .mapframe{position:relative;height:230px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}

  <button onclick="placeOrder('Blinkit')">Blinkit</button>
  <button onclick="placeOrder('Swiggy')">Swiggy</button>
  <button onclick="placeOrder('Zepto')">Zepto</button>
  <button onclick="placeOrder('Uber')">Uber</button>

<script>
/* ============================================================
   SHARED SIMULATED BACKEND  — all four personas read/write here
   ============================================================ */
const DB = {
  society:"Prestige Bellandur",
  resident:{name:"Gaurav", flat:"A-1203", tower:"B"},
  guard:{name:"Ramesh", gate:"Gate 2"},
  partners:{
    Blinkit:{color:"#f7c548",fg:"#3a2c00",letter:"B",eta:6},
    Swiggy:{color:"#fc8019",fg:"#fff",letter:"S",eta:22},
    Zepto:{color:"#7b2ff7",fg:"#fff",letter:"Z",eta:8},
    Uber:{color:"#141a24",fg:"#fff",letter:"U",eta:4},
    "Urban Company":{color:"#0f7a52",fg:"#fff",letter:"UC",eta:0}
  },
  arrivals:[], // {id, partner, flat, status: pending|verified|denied|done, placed, reason, minsToDoor}
  seq:1,
  metrics:{ gateTimeBaseline:172, gateTimeNow:38 }, // seconds
  listings:[
    {id:1, type:"Rent", title:"3 BHK · Tower A, high floor", price:"₹68,000/mo", by:"Verified owner · A-1502", scope:"society", tag:"Posted from this flat", em:"🏠"},
    {id:2, type:"Sell", title:"2 BHK · Tower C, park-facing", price:"₹1.72 Cr", by:"Verified owner · C-0908", scope:"city", tag:"Ownership doc reviewed", em:"🏢"},
    {id:3, type:"Rent", title:"Covered parking · Basement 2", price:"₹3,500/mo", by:"Verified resident · B-0410", scope:"society", tag:"Society confirmed", em:"🅿️"},
    {id:4, type:"Sell", title:"Study table + chair, teak", price:"₹6,500", by:"Verified resident · A-1203", scope:"society", tag:"Neighbour", em:"🪑"},
  ],
  corpVisit:{ host:"Priya Menon · Sequoia", company:"Prestige Tech Park", tower:"Block 4", floor:"Level 9", time:"11:30 AM today", status:"ready" },
};

// seed one live arrival + a couple of completed for charts
function seed(){
  DB.arrivals.push({id:DB.seq++, partner:"Blinkit", flat:"A-1203", status:"pending", placed:"9:38 AM", minsToDoor:4});
  DB.arrivals.push({id:DB.seq++, partner:"Swiggy", flat:"C-0704", status:"pending", placed:"9:40 AM", minsToDoor:6});
  DB.arrivals.push({id:DB.seq++, partner:"Zepto", flat:"B-1105", status:"verified", placed:"9:35 AM", minsToDoor:2});
}
seed();

let view="res";
let guardScreen="gate";      // gate | queue | scanned
let residentScreen="home";   // home | activity | map | market | work
let marketScope="society";   // society | city | india
let marketTab="browse";      // browse | post
let waStep="0";              // 0 (before send) | typing | 1 (replied)
let waNum="9876543210";      // number being approved via WhatsApp
let adminScreen="overview";
let partnerScreen="dashboard";
let activeScan=null;
let gateLight="idle";        // idle | green | red  (self-serve gate device)
let listeners=[];
function onChange(fn){listeners.push(fn)}
function emit(){listeners.forEach(f=>f())}

function toast(msg){
  const el=document.getElementById('toast');
  el.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>${msg}`;
  el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600);
}

/* resident places an order -> appears in guard queue + partner dash */
function placeOrder(partner){
  const p=DB.partners[partner];
  const a={id:DB.seq++, partner, flat:DB.resident.flat, status:"pending", placed:"now", minsToDoor:p.eta||5};
  DB.arrivals.unshift(a);
  toast(`${partner} order placed — heading to your gate`);
  emit(); render();
}

/* guard verifies -> resident sees status flip, metrics update */
function verifyArrival(id, ok){
  const a=DB.arrivals.find(x=>x.id===id); if(!a)return;
  a.status = ok?"verified":"denied";
  emit();
}
function completeArrival(id){
  const a=DB.arrivals.find(x=>x.id===id); if(!a)return;
  a.status="done"; emit();
}

/* ============================================================ SVG helpers */

function openWA(){ waStep='0'; navTo('res','wapprove'); setTimeout(scrollWA,20); }
function waSend(){ if(waStep!=='0') return; waStep='typing'; render(); scrollWA(); setTimeout(function(){ waStep='1'; render(); scrollWA(); }, 950); }
function scrollWA(){ const s=document.getElementById('screen'); if(s) s.scrollTop=s.scrollHeight; }
function waQR(seed){
  const N=25, cell=8, quiet=2, px=(N+quiet*2)*cell;
  let s=2166136261>>>0; const str=String(seed); for(let i=0;i<str.length;i++){s^=str.charCodeAt(i); s=Math.imul(s,16777619)>>>0;}
  const rnd=function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  const R=Array.from({length:N},()=>Array(N).fill(false));
  const M=Array.from({length:N},()=>Array(N).fill(false));
  const fnd=function(r,c){ for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){const rr=r+i,cc=c+j; if(rr<0||cc<0||rr>=N||cc>=N)continue; R[rr][cc]=true; M[rr][cc]=(i>=0&&i<=6&&j>=0&&j<=6)&&((i===0||i===6||j===0||j===6)||(i>=2&&i<=4&&j>=2&&j<=4)); } };
  fnd(0,0); fnd(0,N-7); fnd(N-7,0);
  const a=N-9; for(let i=0;i<5;i++)for(let j=0;j<5;j++){R[a+i][a+j]=true; M[a+i][a+j]=(i===0||i===4||j===0||j===4)||(i===2&&j===2);}
  for(let i=0;i<N;i++){ if(!R[6][i]){R[6][i]=true;M[6][i]=(i%2===0);} if(!R[i][6]){R[i][6]=true;M[i][6]=(i%2===0);} }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(!R[r][c]) M[r][c]=rnd()>0.52; }
  let g=''; for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(M[r][c]) g+='<rect x="'+((c+quiet)*cell)+'" y="'+((r+quiet)*cell)+'" width="'+cell+'" height="'+cell+'"/>'; }
  return '<svg viewBox="0 0 '+px+' '+px+'" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><rect width="'+px+'" height="'+px+'" fill="#fff"/><g fill="#0b1f14">'+g+'</g></svg>';
}

  pendingNav=null;
  const s=document.getElementById('screen');
  if(view==='res') s.innerHTML=residentView();
  else if(view==='guard') s.innerHTML=guardView();
  else if(view==='admin') s.innerHTML=adminView();
  else s.innerHTML=partnerView();
  s.classList.toggle('wamode', view==='res' && residentScreen==='wapprove');
  s.classList.toggle('gdmode', view==='guard' && guardScreen==='device');
  renderNav();
}
onChange(()=>{ if(view==='res'||view==='guard'||view==='partner') render(); });
setView('res');
</script>
</body>
</html>
